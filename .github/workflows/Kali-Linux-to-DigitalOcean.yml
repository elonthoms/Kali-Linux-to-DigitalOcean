name: Kali Linux to DigitalOcean

on:
  workflow_dispatch:
    inputs:
      region:
        description: "DigitalOcean region (e.g., nyc3, sfo3)"
        required: true
        default: "nyc3"
      release_tag_prefix:
        description: "Prefix for release tags"
        required: false
        default: "kali-image"

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch Latest Kali Linux Version
        run: |
          URL=$(curl -s https://kali.download/base-images/current/ | grep -oE 'kali-linux-[0-9]+\.[0-9]+[a-z]?-installer-netinst-amd64\.iso' | head -n 1)
          FULL_URL="https://kali.download/base-images/current/$URL"
          KALI_VERSION=$(echo $URL | grep -oE '[0-9]+\.[0-9]+[a-z]?')
          echo "KALI_VERSION=$KALI_VERSION" >> $GITHUB_ENV
          echo "IMAGE_URL=$FULL_URL" >> $GITHUB_ENV

      - name: Download Kali Linux NetInstaller Image
        run: wget --tries=3 --retry-connrefused --waitretry=5 ${{ env.IMAGE_URL }}

      - name: Compress Image to gzip
        run: |
          mv kali-linux-${{ env.KALI_VERSION }}-installer-netinst-amd64.iso disk.raw
          gzip -c disk.raw > disk.raw.gz

      - name: Versioning
        run: |
          PREFIX="${{ inputs.release_tag_prefix }}"
          if [ ! -f version.txt ]; then
            NEW_VERSION="${PREFIX}-v1.0.0"
            echo "$NEW_VERSION" > version.txt
          else
            VERSION=$(cat version.txt)
            MAJOR_VERSION=$(echo $VERSION | cut -d. -f1 | sed "s/${PREFIX}-v//")
            NEXT_MAJOR_VERSION=$((MAJOR_VERSION + 1))
            NEW_VERSION="${PREFIX}-v$NEXT_MAJOR_VERSION.0.0"
            echo "$NEW_VERSION" > version.txt
          fi
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV

      - name: Commit new version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.txt
          git commit -m "Update version to ${{ env.NEW_VERSION }} - Kali Linux ${{ env.KALI_VERSION }} NetInstaller" || echo "No changes to commit"
          git push

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.NEW_VERSION }}
          files: ./disk.raw.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to DigitalOcean
        env:
          DO_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
        run: |
          curl --retry 3 --retry-delay 10 -X POST "https://api.digitalocean.com/v2/images" \
            -H "Authorization: Bearer $DO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
                  \"name\": \"Kali Linux ${{ env.KALI_VERSION }} NetInstaller from GitHub Actions\",
                  \"url\": \"https://github.com/${{ github.repository }}/releases/download/${{ env.NEW_VERSION }}/disk.raw.gz\",
                  \"distribution\": \"Debian\",
                  \"region\": \"${{ inputs.region }}\",
                  \"description\": \"Kali Linux NetInstaller\",
                  \"tags\": [\"kali\", \"netinst\"]
                }"
